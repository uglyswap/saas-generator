{% extends "base.html" %}
{% block title %}Configuration initiale - SaaS Generator{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Configuration initiale</h1>
        <p class="auth-subtitle">Creez votre compte administrateur pour commencer</p>

        <form method="POST" action="{{ url_for('auth.setup_post') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="input-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required autofocus
                       placeholder="admin" value="admin" minlength="3" maxlength="80">
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required
                       placeholder="admin@votre-entreprise.com">
            </div>

            <div class="input-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required
                       placeholder="min. 8 car., 1 maj., 1 min., 1 chiffre" minlength="8">
            </div>

            <div class="input-group">
                <label for="password_confirm">Confirmer le mot de passe</label>
                <input type="password" id="password_confirm" name="password_confirm" required>
            </div>

            <button type="submit" class="btn btn-primary btn-large">Demarrer SaaS Generator</button>
        </form>
    </div>
</div>
{% endblock %}
