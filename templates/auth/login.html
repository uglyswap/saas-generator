{% extends "base.html" %}
{% block title %}Connexion - AI Tool Builder{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh] -mt-6">
    <div class="w-full max-w-md">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 shadow-sm">
            <!-- Logo -->
            <div class="flex justify-center mb-6">
                <div class="w-12 h-12 bg-blue-600 dark:bg-blue-500 rounded-xl flex items-center justify-center">
                    <i data-lucide="zap" class="w-7 h-7 text-white"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-center mb-1">Connexion</h1>
            <p class="text-center text-sm text-slate-500 dark:text-slate-400 mb-8">Connectez-vous pour acceder a vos templates</p>

            <form method="POST" action="{{ url_for('auth.login_post') }}" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Nom d'utilisateur ou email</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input type="text" id="username" name="username" required autofocus
                               placeholder="votre identifiant"
                               class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-sm">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Mot de passe</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input type="password" id="password" name="password" required
                               placeholder="votre mot de passe"
                               class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-sm">
                    </div>
                </div>

                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="remember" class="rounded border-slate-300 dark:border-slate-600 text-blue-600 focus:ring-blue-500">
                    <span class="text-sm text-slate-600 dark:text-slate-400">Se souvenir de moi</span>
                </label>

                <button type="submit" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium text-sm transition-colors">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    Se connecter
                </button>
            </form>

            <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
                Pas encore de compte ?
                <a href="{{ url_for('auth.register') }}" class="text-blue-600 dark:text-blue-400 font-medium hover:underline">Creer un compte</a>
            </p>
        </div>
    </div>
</div>

<script>if (typeof lucide !== 'undefined') lucide.createIcons();</script>
{% endblock %}
