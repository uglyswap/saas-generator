{% extends "base.html" %}
{% block title %}Connexion - SaaS Generator{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Connexion</h1>
        <p class="auth-subtitle">Connectez-vous pour acceder a vos templates</p>

        <form method="POST" action="{{ url_for('auth.login_post') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="input-group">
                <label for="username">Nom d'utilisateur ou email</label>
                <input type="text" id="username" name="username" required autofocus
                       placeholder="votre identifiant">
            </div>

            <div class="input-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required
                       placeholder="votre mot de passe">
            </div>

            <div class="input-group-inline">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember"> Se souvenir de moi
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-large">Se connecter</button>
        </form>

        <p class="auth-link">
            Pas encore de compte ?
            <a href="{{ url_for('auth.register') }}">Creer un compte</a>
        </p>
    </div>
</div>
{% endblock %}
