name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov ruff bandit pip-audit

    # Etapes qualite/securite introduites en mode informatif (continue-on-error) :
    # elles remontent les problemes sans bloquer la CI, le temps de nettoyer
    # l'existant. Retirer continue-on-error pour les rendre bloquantes une fois au vert.
    - name: Lint (ruff)
      continue-on-error: true
      run: ruff check .

    - name: Security scan (bandit)
      continue-on-error: true
      run: bandit -r app -ll

    - name: Dependency audit (pip-audit)
      continue-on-error: true
      run: pip-audit

    - name: Run tests with coverage
      env:
        FLASK_ENV: testing
        SECRET_KEY: ci-test-secret-key
      run: |
        pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

    - name: Check imports
      run: |
        python -c "from app import create_app; app = create_app('testing'); print('App factory OK')"
