version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Pas de fallback : l'app refuse de demarrer en production sans SECRET_KEY fort
      - SECRET_KEY=${SECRET_KEY:?Definissez SECRET_KEY dans .env (python -c "import secrets; print(secrets.token_hex(32))")}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-16384}
      - LLM_REQUEST_TIMEOUT=${LLM_REQUEST_TIMEOUT:-300}
      - DATABASE_URL=postgresql://saas:saas@db:5432/saas_generator
      - FLASK_ENV=production
    volumes:
      - ./exports:/app/exports
      - ./instance:/app/instance
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=saas
      - POSTGRES_PASSWORD=saas
      - POSTGRES_DB=saas_generator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas_generator"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
